<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>2026届中考录取查询</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f2f5f9;color:#1f2d3d;line-height:1.6}
  header{background:linear-gradient(135deg,#2b8a9e,#3aa6b9);color:#fff;text-align:center;padding:18px 12px;font-size:20px;font-weight:700;letter-spacing:1px}
  nav{display:flex;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.06)}
  nav button{flex:1;border:0;background:none;padding:14px 0;font-size:15px;color:#7a8aa0;cursor:pointer;border-bottom:3px solid transparent}
  nav button.active{color:#2b8a9e;border-bottom-color:#2b8a9e;font-weight:700}
  main{max-width:640px;margin:0 auto;padding:16px}
  .search{display:flex;gap:8px;margin-bottom:14px}
  .search input{flex:1;border:1px solid #cfd8e3;border-radius:10px;padding:12px 14px;font-size:16px;outline:none}
  .search input:focus{border-color:#2b8a9e}
  .search button{background:#2b8a9e;color:#fff;border:0;border-radius:10px;padding:0 20px;font-size:16px;cursor:pointer}
  .search button:active{opacity:.85}
  #result{min-height:20px;margin-bottom:16px}
  .banner{background:#fff0f0;border:1px solid #ffc9c9;border-radius:10px;padding:12px 14px;margin-bottom:14px;color:#e02323;font-weight:700;text-align:center;font-size:15px;line-height:1.9}
  .tip{color:#e07b39;background:#fff4ec;padding:12px 14px;border-radius:10px}
  .ok{color:#2b8a9e;font-weight:700;margin-bottom:8px}
  .schools{list-style:none}
  .schools li{background:#fff;border:1px solid #e3eaf2;border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:15px}
  .intro{background:#fff;border-radius:12px;padding:14px 16px;font-size:14px;color:#445}
  .intro h3{font-size:15px;color:#2b8a9e;margin-bottom:8px}
  .intro p{white-space:pre-line;margin:0}
  .warn{background:#fff8e6;border:1px solid #ffe2a8;border-radius:12px;padding:14px 16px;margin-bottom:16px}
  .warnTitle{color:#c8791a;font-weight:700;margin-bottom:10px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:#fff;border:1px solid #ffd591;border-radius:20px;padding:6px 12px;font-size:13px;color:#9a6b1f}
  .about{background:#fff;border-radius:12px;padding:16px;font-size:15px;white-space:pre-line;min-height:120px;color:#334}
  footer{text-align:center;font-size:12px;color:#9aa7b8;padding:18px 12px}
  footer .busuanzi{display:block;margin-bottom:6px;color:#7a8aa0}
</style>
</head>
<body>
<header>2026届中考录取查询</header>
<nav>
  <button id="tabFunc" class="active">功能使用</button>
  <button id="tabAbout">作者简介</button>
</nav>
<main>
  <section id="funcPage">
    <div class="search">
      <input id="nameInput" type="text" placeholder="请输入考生姓名" autocomplete="off">
      <button id="searchBtn">查询</button>
    </div>
    <div class="banner" id="bannerBox"></div>
    <div id="result"></div>
    <div class="warn" id="schoolBox"></div>
    <div class="intro" id="introBox"></div>
  </section>
  <section id="aboutPage" style="display:none">
    <div class="about" id="aboutText"></div>
  </section>
</main>
<footer>
  <span class="busuanzi">总访问 <span id="busuanzi_value_site_pv">0</span> 次 · 访客 <span id="busuanzi_value_site_uv">0</span> 人</span>
  数据由运营者整理，非官方发布渠道，结果仅供参考
</footer>
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<script src="data.js"></script>
  <script src="about.js"></script>
<script>
(function(){
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  document.getElementById('introBox').innerHTML = '<h3>使用说明</h3><p>' + esc(window.INTRO||'') + '</p>';
  document.getElementById('bannerBox').innerHTML = (window.MESSAGE||'').replace(/\n/g,'<br>');
  var schools = window.SUPPORTED_SCHOOLS||[];
  var sh = '<p class="warnTitle">⚠ 目前创作尚未完成，暂时只支持以下学校，其他学校暂不可查：</p><div class="chips">';
  schools.forEach(function(s){ sh+='<span class="chip">'+esc(s)+'</span>'; });
  sh+='</div>';
  document.getElementById('schoolBox').innerHTML = sh;
  function search(){
    var name = (document.getElementById('nameInput').value||'').trim();
    var box = document.getElementById('result');
    if(!name){ box.innerHTML='<p class="tip">请输入考生姓名</p>'; return; }
    var hits=[];
    for(var k in window.DICT){ if(window.DICT.hasOwnProperty(k) && k.indexOf(name)!==-1){ hits.push(window.DICT[k]); } }
    var seen={}, uniq=[];
    hits.forEach(function(v){ if(!seen[v]){seen[v]=1;uniq.push(v);} });
    if(uniq.length===0){
      box.innerHTML='<p class="tip">未查询到「'+esc(name)+'」的录取信息。<br>可能名单中暂无该考生，或姓名写法不一致，可换个写法再试。</p>';
    } else {
      var h='<p class="ok">查询到 '+uniq.length+' 条匹配，对应学校/批次：</p><ul class="schools">';
      uniq.forEach(function(v){ h+='<li>'+esc(v)+'</li>'; });
      h+='</ul>';
      box.innerHTML=h;
    }
  }
  document.getElementById('searchBtn').onclick=search;
  document.getElementById('nameInput').addEventListener('keydown',function(e){ if(e.key==='Enter') search(); });
  function tab(w){
    document.getElementById('funcPage').style.display = w==='func'?'block':'none';
    document.getElementById('aboutPage').style.display = w==='about'?'block':'none';
    document.getElementById('tabFunc').classList.toggle('active', w==='func');
    document.getElementById('tabAbout').classList.toggle('active', w==='about');
  }
  document.getElementById('tabFunc').onclick=function(){tab('func');};
  document.getElementById('tabAbout').onclick=function(){tab('about');};
  var ab = window.ABOUT || '作者简介加载失败，请确认 about.js 已一同放置在同目录';
  document.getElementById('aboutText').innerHTML = ab.replace(/\n/g,'<br>');
})();
</script>
</body>
</html>
